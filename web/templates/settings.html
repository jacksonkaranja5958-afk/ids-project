{% extends "base.html" %}
{% block title %}Settings - IDS{% endblock %}

{% block content %}
    <h1>Settings</h1>

    {% if saved %}
    <div class="card">
        <p class="ALLOW">Settings saved successfully.</p>
    </div>
    {% endif %}

    <div class="card">
        <h2>System Configuration</h2>
        <form method="POST" action="/settings">
            <p>
                <label><strong>Fail policy</strong></label><br>
                <select name="fail_policy">
                    <option value="fail-closed" {% if settings.fail_policy == "fail-closed" %}selected{% endif %}>Fail-closed (block if detection engine is unavailable)</option>
                    <option value="fail-open" {% if settings.fail_policy == "fail-open" %}selected{% endif %}>Fail-open (allow if detection engine is unavailable)</option>
                </select>
            </p>

            <p>
                <label><strong>Sandbox entropy threshold</strong> (0.0 - 8.0)</label><br>
                <input type="number" step="0.1" min="0" max="8" name="sandbox_entropy_threshold" value="{{ settings.sandbox_entropy_threshold }}">
            </p>

            <p>
                <label><strong>Log retention limit</strong> (entries shown on Logs page)</label><br>
                <input type="number" min="10" max="1000" name="log_retention_limit" value="{{ settings.log_retention_limit }}">
            </p>

            <button type="submit">Save Settings</button>
        </form>
    </div>
{% endblock %}
